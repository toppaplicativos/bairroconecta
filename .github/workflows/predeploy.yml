name: Predeploy check

on:
  push:
    branches:
      - deploy/meu-bairro
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Compile-only placeholders. Real secrets stay in Vercel/Supabase.
      GOOGLE_GENAI_API_KEY: build-placeholder
      NEXT_PUBLIC_MAPBOX_TOKEN: build-placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
      SUPABASE_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
